name: Build and Test

# CI builds and tests the connector, and packs the extension. The LibreOffice UNO half cannot be
# exercised without a LibreOffice, so its one end-to-end test reports itself as skipped rather
# than passed; everything about the extension that can be checked without an office — every menu
# URL naming an exported function, every icon a mapping names being present — is checked by
# build.py, which is why packing is part of CI.
#
# Builds on pull_request only. A push trigger would build the very same commit a second time:
# the PR to next, the push when it merged, the next->main PR, and the push when that merged.
# The PR build is the one anybody reads.
on:
  pull_request:
    branches: [ "main", "next" ]
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # Nothing here needs Windows: the connector targets netstandard2.0 and net8.0, and the
    # extension is Python and XML. Linux minutes bill at a fifth of Windows minutes.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Record the SDK that built this
      run: dotnet --version

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Add Nexus PLM package feed
      # Nexus.PLM.Addin.Sdk.Templates is served from GitHub Packages, which requires
      # authentication even for public packages.
      run: >
        dotnet nuget add source "https://nuget.pkg.github.com/Nexus-PLM/index.json"
        --name nexus-plm
        --username "${{ github.actor }}"
        --password "${{ secrets.NUGET_READ_TOKEN || secrets.GITHUB_TOKEN }}"
        --store-password-in-clear-text

    - name: Restore
      run: dotnet restore Nexus.PLM.LibreOffice.Templates.Tests/Nexus.PLM.LibreOffice.Templates.Tests.csproj

    - name: Build
      run: dotnet build Nexus.PLM.LibreOffice.Templates.Tests/Nexus.PLM.LibreOffice.Templates.Tests.csproj --no-restore -c Release

    - name: Test
      run: dotnet test Nexus.PLM.LibreOffice.Templates.Tests/Nexus.PLM.LibreOffice.Templates.Tests.csproj --no-build -c Release

    - name: Test the translators
      run: dotnet test Nexus.PLM.LibreOffice.Translators.Tests/Nexus.PLM.LibreOffice.Translators.Tests.csproj -c Release

    - name: Test the add-in's own Python
      # The UNO-facing code imports no UNO at module scope, so the path conversions it hands to
      # LibreOffice can be checked without an office. Windows-path cases report as skipped here.
      run: python3 -m unittest discover -s tests/python -v

    - name: Pack the extension
      # Fails if a menu names a function the script does not export, or an icon a mapping
      # names is missing. Does not install: there is no LibreOffice here to install into.
      run: python3 extension/build.py

    - name: Keep the package
      uses: actions/upload-artifact@v4
      with:
        name: NexusPLM.oxt
        path: dist/NexusPLM.oxt

  # A v* tag attaches the translators deliverable to the GitHub release: the publish output of
  # Nexus.PLM.LibreOffice.Translators minus the contract DLL, which must never ride into a
  # plugin folder. The .deps.json stays in - the server's resolver is rooted at it. The zip is
  # platform-neutral (framework-dependent net8), so the ubuntu runner is fine.
  release-translators:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Add Nexus PLM package feed
      run: >
        dotnet nuget add source "https://nuget.pkg.github.com/Nexus-PLM/index.json"
        --name nexus-plm
        --username "${{ github.actor }}"
        --password "${{ secrets.NUGET_READ_TOKEN || secrets.GITHUB_TOKEN }}"
        --store-password-in-clear-text

    - name: Publish the translators
      run: dotnet publish Nexus.PLM.LibreOffice.Translators/Nexus.PLM.LibreOffice.Translators.csproj -c Release -o out

    - name: Assert the contract DLL did not ride along, then zip
      run: |
        test ! -f out/Nexus.PLM.Addin.Sdk.Translators.dll
        test -f out/Nexus.PLM.LibreOffice.Translators.deps.json
        (cd out && zip -r ../Nexus.PLM.LibreOffice.Translators.zip .)

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" --notes "LibreOffice add-in release ${GITHUB_REF_NAME}" || true
        gh release upload "${GITHUB_REF_NAME}" Nexus.PLM.LibreOffice.Translators.zip --clobber
